# HAProxy for the myhealthz demo.
#
# Traffic ports 3307/3308; health checks go to the myhealthz sidecar
# listening on :8080 in each database container's network namespace
# (check port), so both `dbN:3306` (MariaDB) and `dbN:8080` (myhealthz)
# resolve to the same container.

global
  log stdout format raw local0 info

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

# Writes: exactly one healthy backend (the primary).
listen mysql-write
  bind *:3307
  option httpchk
  http-check send meth GET uri /health/primary ver HTTP/1.1 hdr Host localhost
  default-server inter 500ms fall 1 rise 2 on-marked-down shutdown-sessions
  server db1 db1:3306 check port 8080
  server db2 db2:3306 check port 8080
  server db3 db3:3306 check port 8080

# Reads: spread across healthy replicas.
listen mysql-read
  bind *:3308
  balance leastconn
  option httpchk
  http-check send meth GET uri /health/replica ver HTTP/1.1 hdr Host localhost
  default-server inter 500ms fall 1 rise 2 on-marked-down shutdown-sessions
  server db1 db1:3306 check port 8080
  server db2 db2:3306 check port 8080
  server db3 db3:3306 check port 8080

listen stats
  mode http
  bind *:9000
  stats enable
  stats uri /
  stats refresh 2s
